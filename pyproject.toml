[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "regagentops"
version = "0.4.0"
description = "Evidence-backed authorization and governance control plane for AI agents in regulated enterprises"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Bilge Kayalı" }]
license = { text = "Apache-2.0" }
dependencies = [
  "PyJWT[crypto]>=2.13,<3",
]
keywords = [
  "ai-agents",
  "authorization",
  "delegated-authority",
  "governance",
  "human-approval",
  "mcp",
  "oidc",
  "policy-engine",
  "regulated-enterprise",
  "workload-identity",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.scripts]
regagentops = "regagentops.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
