name: Production Reference Deployment Boundary

on:
  push:
    branches:
      - main
      - "agent/**"
    paths:
      - "src/regagentops/deployment.py"
      - "tests/test_deployment*.py"
      - "schemas/egress-policy.schema.json"
      - "schemas/tool-allowlist-policy.schema.json"
      - "schemas/isolated-policy-worker-profile.schema.json"
      - "schemas/deployment-release-manifest.schema.json"
      - "schemas/rollback-plan.schema.json"
      - "schemas/upgrade-plan.schema.json"
      - "schemas/recovery-checkpoint.schema.json"
      - "pyproject.toml"
      - "README.md"
      - "docs/PRODUCTION_REFERENCE.md"
      - "docs/runbooks/**"
      - "docs/ARCHITECTURE.md"
      - "docs/ROADMAP.md"
      - "docs/THREAT_MODEL.md"
      - ".github/workflows/production-reference.yml"
      - ".github/workflows/codeql.yml"
      - ".github/workflows/release-provenance.yml"
  pull_request:
    paths:
      - "src/regagentops/deployment.py"
      - "tests/test_deployment*.py"
      - "schemas/egress-policy.schema.json"
      - "schemas/tool-allowlist-policy.schema.json"
      - "schemas/isolated-policy-worker-profile.schema.json"
      - "schemas/deployment-release-manifest.schema.json"
      - "schemas/rollback-plan.schema.json"
      - "schemas/upgrade-plan.schema.json"
      - "schemas/recovery-checkpoint.schema.json"
      - "pyproject.toml"
      - "README.md"
      - "docs/PRODUCTION_REFERENCE.md"
      - "docs/runbooks/**"
      - "docs/ARCHITECTURE.md"
      - "docs/ROADMAP.md"
      - "docs/THREAT_MODEL.md"
      - ".github/workflows/production-reference.yml"
      - ".github/workflows/codeql.yml"
      - ".github/workflows/release-provenance.yml"

permissions:
  contents: read

jobs:
  production-reference-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e .
      - name: Run production reference regression tests
        run: python -m unittest discover -s tests -p 'test_deployment*.py' -v
      - name: Verify v0.9+ deployment contracts
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import tomllib

          payload = tomllib.load(open('pyproject.toml', 'rb'))
          version = tuple(int(part) for part in payload['project']['version'].split('.'))
          assert version >= (0, 9, 0)
          assert payload['project']['dependencies'] == ['PyJWT[crypto]>=2.13,<3']
          expected = {
              'egress-policy.schema.json': 'regagentops.egress-policy.v1',
              'tool-allowlist-policy.schema.json': 'regagentops.tool-allowlist-policy.v1',
              'isolated-policy-worker-profile.schema.json': 'regagentops.isolated-policy-worker-profile.v1',
              'deployment-release-manifest.schema.json': 'regagentops.deployment-release-manifest.v1',
              'rollback-plan.schema.json': 'regagentops.rollback-plan.v1',
              'upgrade-plan.schema.json': 'regagentops.upgrade-plan.v1',
              'recovery-checkpoint.schema.json': 'regagentops.recovery-checkpoint.v1',
          }
          for filename, discriminator in expected.items():
              schema = json.loads((Path('schemas') / filename).read_text(encoding='utf-8'))
              assert schema['$schema'] == 'https://json-schema.org/draft/2020-12/schema'
              assert schema['additionalProperties'] is False
              assert schema['properties']['schema_version']['const'] == discriminator

          egress = json.loads(Path('schemas/egress-policy.schema.json').read_text())
          assert egress['properties']['default_deny']['const'] is True
          assert egress['properties']['allow_wildcards']['const'] is False
          assert egress['properties']['allow_plaintext']['const'] is False
          tools = json.loads(Path('schemas/tool-allowlist-policy.schema.json').read_text())
          assert tools['properties']['default_deny']['const'] is True
          assert tools['properties']['direct_tool_invocation_allowed']['const'] is False
          worker = json.loads(Path('schemas/isolated-policy-worker-profile.schema.json').read_text())
          for field in ('network_namespace_isolated', 'run_as_non_root', 'read_only_root_filesystem', 'no_new_privileges', 'drop_all_linux_capabilities'):
              assert worker['properties'][field]['const'] is True
          for field in ('privileged', 'host_network', 'host_pid', 'host_ipc', 'direct_tool_invocation'):
              assert worker['properties'][field]['const'] is False
          assert worker['properties']['seccomp_profile']['const'] == 'RuntimeDefault'
          release = json.loads(Path('schemas/deployment-release-manifest.schema.json').read_text())
          for field in ('source_commit_sha', 'artifact_sha256', 'codeql_evidence_digest', 'provenance_attestation_digest', 'checksum_manifest_digest'):
              assert field in release['required']
          PY
      - name: Verify non-deploying fail-closed deployment surface
        shell: bash
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          path = Path('src/regagentops/deployment.py')
          source = path.read_text(encoding='utf-8')
          tree = ast.parse(source, filename=str(path))
          banned = {'asyncio', 'ftplib', 'http', 'requests', 'socket', 'subprocess', 'telnetlib', 'urllib'}
          for node in ast.walk(tree):
              if isinstance(node, ast.Import):
                  roots = {alias.name.split('.')[0] for alias in node.names}
              elif isinstance(node, ast.ImportFrom) and node.module:
                  roots = {node.module.split('.')[0]}
              else:
                  continue
              blocked = roots & banned
              if blocked:
                  raise SystemExit(f'{path}: forbidden capability import(s): {sorted(blocked)}')

          required_markers = (
              'production egress policy must be default deny',
              'production egress policy must forbid wildcard destinations',
              'egress IP must use canonical textual form',
              'one governed tool may bind to only one executor',
              'policy worker must not directly invoke tools',
              'production policy worker requires',
              'production deployment registry requires a TenantIsolationRegistry',
              'worker profile must bind current tenant isolation profile',
              'worker profile cannot predate its current deployment policies',
              'release cannot predate its worker profile',
              'release egress policy is stale',
              'release tool allowlist is stale',
              'release tenant isolation profile is stale',
              'rollback target must be an older release',
              'upgrade rollback plan must exactly reverse the release transition',
              'never opens sockets, deploys workloads or invokes tools',
          )
          for marker in required_markers:
              if marker not in source:
                  raise SystemExit(f'missing v0.9 deployment invariant: {marker}')
          for marker in ('requests.', 'httpx.', 'subprocess.', '.connect(', '.deploy(', '.invoke(', '.execute_tool('):
              if marker in source:
                  raise SystemExit(f'deployment reference core violates non-deploying boundary: {marker}')
          PY
      - name: Verify security and release workflow contracts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          codeql = Path('.github/workflows/codeql.yml').read_text(encoding='utf-8')
          assert 'github/codeql-action/init@v4' in codeql
          assert 'github/codeql-action/analyze@v4' in codeql
          assert 'security-extended' in codeql

          release = Path('.github/workflows/release-provenance.yml').read_text(encoding='utf-8')
          assert 'actions/attest@v4' in release
          assert 'id-token: write' in release
          assert 'attestations: write' in release
          assert "startsWith(github.ref, 'refs/tags/v')" in release
          assert 'SHA256SUMS' in release

          for runbook in ('DEPLOYMENT.md', 'INCIDENT_RESPONSE.md', 'KEY_ROTATION.md', 'DISASTER_RECOVERY.md'):
              path = Path('docs/runbooks') / runbook
              if not path.exists() or len(path.read_text(encoding='utf-8').strip()) < 200:
                  raise SystemExit(f'missing substantive v0.9 runbook: {path}')
          PY
