name: CI

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .
      - name: Compile package
        run: python -m compileall -q src
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Enforce offline authorization identity approval MCP execution data assurance and hardening boundary
        shell: bash
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          banned = {"asyncio", "ftplib", "http", "requests", "socket", "subprocess", "telnetlib", "urllib"}
          core_files = [
              Path("src/regagentops/models.py"),
              Path("src/regagentops/registry.py"),
              Path("src/regagentops/policy.py"),
              Path("src/regagentops/cli.py"),
              Path("src/regagentops/identity_models.py"),
              Path("src/regagentops/oidc.py"),
              Path("src/regagentops/workload_identity.py"),
              Path("src/regagentops/identity_binding.py"),
              Path("src/regagentops/registered_identity.py"),
              Path("src/regagentops/authenticated_identity_signature.py"),
              Path("src/regagentops/authenticated_policy.py"),
              Path("src/regagentops/approval_models.py"),
              Path("src/regagentops/approval_authority.py"),
              Path("src/regagentops/approval_signature.py"),
              Path("src/regagentops/approval_replay.py"),
              Path("src/regagentops/approval_engine.py"),
              Path("src/regagentops/mcp.py"),
              Path("src/regagentops/execution.py"),
              Path("src/regagentops/data_governance.py"),
              Path("src/regagentops/assurance.py"),
              Path("src/regagentops/hardening.py"),
          ]
          for path in core_files:
              source = path.read_text(encoding="utf-8")
              tree = ast.parse(source, filename=str(path))
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      imports = {alias.name.split(".")[0] for alias in node.names}
                  elif isinstance(node, ast.ImportFrom) and node.module:
                      imports = {node.module.split(".")[0]}
                  else:
                      continue
                  blocked = imports & banned
                  if blocked:
                      raise SystemExit(f"{path}: forbidden capability import(s): {sorted(blocked)}")
          oidc_source = Path("src/regagentops/oidc.py").read_text(encoding="utf-8")
          if "PyJWKClient" in oidc_source:
              raise SystemExit("OIDC verifier must not use network-capable PyJWKClient")
          mcp_source = Path("src/regagentops/mcp.py").read_text(encoding="utf-8")
          for marker in ("list_tools(", "discover_tools(", "connect(", "requests.", "httpx."):
              if marker in mcp_source:
                  raise SystemExit(f"MCP core must not contain autonomous discovery/network marker: {marker}")
          execution_source = Path("src/regagentops/execution.py").read_text(encoding="utf-8")
          for marker in ("requests.", "httpx.", "subprocess.", ".invoke(", ".execute_tool("):
              if marker in execution_source:
                  raise SystemExit(f"execution core must remain non-invoking/offline: {marker}")
          data_source = Path("src/regagentops/data_governance.py").read_text(encoding="utf-8")
          for marker in ("requests.", "httpx.", "subprocess.", ".invoke(", ".execute_tool("):
              if marker in data_source:
                  raise SystemExit(f"data governance core must remain metadata-only/offline: {marker}")
          assurance_source = Path("src/regagentops/assurance.py").read_text(encoding="utf-8")
          for marker in ("requests.", "httpx.", "subprocess.", ".invoke(", ".execute_tool(", "auto_classify", "determine_compliance"):
              if marker in assurance_source:
                  raise SystemExit(f"assurance core must remain offline and non-determinative: {marker}")
          hardening_source = Path("src/regagentops/hardening.py").read_text(encoding="utf-8")
          for marker in (
              "psycopg", "sqlalchemy", "boto3", "botocore", "google.cloud", "azure.",
              "requests.", "httpx.", "subprocess.", ".connect(", ".execute(", ".invoke(", ".execute_tool("
          ):
              if marker in hardening_source:
                  raise SystemExit(f"hardening core must remain adapter-only/offline: {marker}")
          PY

  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build package
        run: |
          python -m pip install build
          python -m build
      - name: Smoke-test wheel
        shell: bash
        run: |
          python -m venv /tmp/regagentops-smoke
          /tmp/regagentops-smoke/bin/python -m pip install dist/*.whl
          /tmp/regagentops-smoke/bin/regagentops --version
          /tmp/regagentops-smoke/bin/python - <<'PY'
          from importlib.metadata import version
          import regagentops
          import regagentops.approval_authority
          import regagentops.approval_engine
          import regagentops.approval_replay
          import regagentops.approval_signature
          import regagentops.assurance
          import regagentops.authenticated_identity_signature
          import regagentops.authenticated_policy
          import regagentops.data_governance
          import regagentops.execution
          import regagentops.hardening
          import regagentops.identity_binding
          import regagentops.mcp
          import regagentops.oidc
          import regagentops.workload_identity
          assert regagentops.__version__ == version('regagentops') == '0.8.0'
          assert regagentops.mcp.MCP_MAX_TOOLS_PER_SNAPSHOT == 128
          assert regagentops.execution.EXECUTION_LEASE_MAX_SECONDS == 120
          assert regagentops.execution.EXECUTION_AUTHORIZATION_MAX_AGE_SECONDS == 120
          assert regagentops.data_governance.DataCategory.PERSONAL.value == 'personal'
          assert regagentops.assurance.SUPPORTED_FRAMEWORK_VERSIONS[regagentops.assurance.AssuranceFramework.NIST_AI_RMF] == '1.0'
          assert regagentops.assurance.SUPPORTED_FRAMEWORK_VERSIONS[regagentops.assurance.AssuranceFramework.ISO_IEC_42001] == '2023'
          assert regagentops.assurance.SUPPORTED_FRAMEWORK_VERSIONS[regagentops.assurance.AssuranceFramework.EU_AI_ACT] == '2024/1689'
          assert regagentops.hardening.CryptoKeyCustody.KMS.value == 'kms'
          assert regagentops.hardening.CryptoKeyCustody.HSM.value == 'hsm'
          assert regagentops.hardening.CryptoAlgorithm.AES_256_GCM.value == 'AES-256-GCM'
          PY
          /tmp/regagentops-smoke/bin/regagentops demo-decision > /tmp/regagentops-decision.json
          /tmp/regagentops-smoke/bin/python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/regagentops-decision.json').read_text())
          assert payload['execution_performed'] is False
          assert payload['decision']['decision'] == 'ALLOW_WITH_CONSTRAINTS'
          PY
