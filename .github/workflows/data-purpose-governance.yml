name: Data and Purpose Governance Boundary

on:
  push:
    branches:
      - main
      - "agent/**"
    paths:
      - "src/regagentops/data_governance.py"
      - "src/regagentops/models.py"
      - "tests/test_data_governance*.py"
      - "schemas/data-*.json"
      - "schemas/authorization-decision.schema.json"
      - "schemas/authenticated-authorization-decision.schema.json"
      - "pyproject.toml"
      - "README.md"
      - "docs/DATA_PURPOSE_GOVERNANCE.md"
      - "docs/ARCHITECTURE.md"
      - "docs/ROADMAP.md"
      - "docs/THREAT_MODEL.md"
      - ".github/workflows/data-purpose-governance.yml"
  pull_request:
    paths:
      - "src/regagentops/data_governance.py"
      - "src/regagentops/models.py"
      - "tests/test_data_governance*.py"
      - "schemas/data-*.json"
      - "schemas/authorization-decision.schema.json"
      - "schemas/authenticated-authorization-decision.schema.json"
      - "pyproject.toml"
      - "README.md"
      - "docs/DATA_PURPOSE_GOVERNANCE.md"
      - "docs/ARCHITECTURE.md"
      - "docs/ROADMAP.md"
      - "docs/THREAT_MODEL.md"
      - ".github/workflows/data-purpose-governance.yml"

permissions:
  contents: read

jobs:
  data-purpose-governance-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e .
      - name: Run data-purpose governance regression tests
        run: python -m unittest discover -s tests -p 'test_data_governance*.py' -v
      - name: Verify v0.6 data-purpose contracts
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import tomllib

          payload = tomllib.load(open('pyproject.toml', 'rb'))
          assert payload['project']['version'] == '0.6.0'
          assert payload['project']['dependencies'] == ['PyJWT[crypto]>=2.13,<3']
          expected = {
              'data-resource-profile.schema.json': 'regagentops.data-resource-profile.v1',
              'data-use-declaration.schema.json': 'regagentops.data-use-declaration.v1',
              'data-governance-decision.schema.json': 'regagentops.data-governance-decision.v1',
          }
          for filename, discriminator in expected.items():
              schema = json.loads((Path('schemas') / filename).read_text(encoding='utf-8'))
              assert schema['$schema'] == 'https://json-schema.org/draft/2020-12/schema'
              assert schema['additionalProperties'] is False
              assert schema['properties']['schema_version']['const'] == discriminator
          authorization = json.loads(Path('schemas/authorization-decision.schema.json').read_text())
          assert 'governance_evidence_digests' in authorization['required']
          profile = json.loads(Path('schemas/data-resource-profile.schema.json').read_text())
          assert profile['properties']['max_retention_seconds']['maximum'] == 315360000
          PY
      - name: Verify bounded fail-closed data governance surface
        shell: bash
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          path = Path('src/regagentops/data_governance.py')
          source = path.read_text(encoding='utf-8')
          tree = ast.parse(source, filename=str(path))
          banned = {'asyncio', 'ftplib', 'http', 'requests', 'socket', 'subprocess', 'telnetlib', 'urllib'}
          for node in ast.walk(tree):
              if isinstance(node, ast.Import):
                  roots = {alias.name.split('.')[0] for alias in node.names}
              elif isinstance(node, ast.ImportFrom) and node.module:
                  roots = {node.module.split('.')[0]}
              else:
                  continue
              blocked = roots & banned
              if blocked:
                  raise SystemExit(f'{path}: forbidden capability import(s): {sorted(blocked)}')
          required_markers = (
              'data_category_profile_mismatch',
              'purpose_not_compatible_with_resource',
              'retention_exceeds_resource_policy',
              'output_handling_not_permitted',
              'data governance state changed after authorization',
              'governance_evidence_digests',
              'McpPolicyEnforcementPoint',
              'ExecutionGate',
              'single-pass adapter',
          )
          for marker in required_markers:
              if marker not in source:
                  raise SystemExit(f'missing v0.6 fail-closed invariant: {marker}')
          for marker in ('requests.', 'httpx.', 'subprocess.', '.invoke(', '.execute_tool(', 'self._base._mcp', 'self._base._agents'):
              if marker in source:
                  raise SystemExit(f'data governance core violates capability/composition boundary: {marker}')
          PY