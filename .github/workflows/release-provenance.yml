name: Release Provenance Gate

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "schemas/**"
      - "pyproject.toml"
      - ".github/workflows/release-provenance.yml"
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-contract:
    name: Build and verify release contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build wheel
        run: |
          python -m pip install build
          python -m build --wheel
      - name: Generate deterministic checksum manifest
        shell: bash
        run: |
          find dist -maxdepth 1 -type f -name '*.whl' -print0 | sort -z | xargs -0 sha256sum > dist/SHA256SUMS
          test -s dist/SHA256SUMS
      - name: Verify package and workflow release invariants
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import tomllib

          payload = tomllib.load(open('pyproject.toml', 'rb'))
          version = payload['project']['version']
          wheels = list(Path('dist').glob('*.whl'))
          assert len(wheels) == 1, wheels
          normalized = version.replace('-', '_')
          assert normalized in wheels[0].name, (version, wheels[0].name)
          sums = Path('dist/SHA256SUMS').read_text(encoding='utf-8').strip().splitlines()
          assert len(sums) == 1
          assert len(sums[0].split()[0]) == 64
          workflow = Path('.github/workflows/release-provenance.yml').read_text(encoding='utf-8')
          assert 'actions/attest@v4' in workflow
          assert 'id-token: write' in workflow
          assert 'attestations: write' in workflow
          assert "startsWith(github.ref, 'refs/tags/v')" in workflow
          PY

  attest-release:
    name: Attest tagged release artifacts
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release-contract
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify tag matches package version
        shell: bash
        run: |
          VERSION=$(python - <<'PY'
          import tomllib
          print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])
          PY
          )
          test "${GITHUB_REF_NAME#v}" = "$VERSION"
      - name: Build release wheel and checksum manifest
        shell: bash
        run: |
          python -m pip install build
          python -m build --wheel
          find dist -maxdepth 1 -type f -name '*.whl' -print0 | sort -z | xargs -0 sha256sum > dist/SHA256SUMS
      - name: Attest release wheel provenance
        uses: actions/attest@v4
        with:
          subject-path: "dist/*.whl"
      - name: Attest checksum manifest provenance
        uses: actions/attest@v4
        with:
          subject-path: "dist/SHA256SUMS"
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: regagentops-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error
