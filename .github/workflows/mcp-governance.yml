name: MCP Governance Boundary

on:
  push:
    branches:
      - main
      - "agent/**"
    paths:
      - "src/regagentops/mcp.py"
      - "tests/test_mcp*.py"
      - "schemas/mcp-*.json"
      - "pyproject.toml"
      - "README.md"
      - "docs/MCP_GOVERNANCE.md"
      - "docs/ARCHITECTURE.md"
      - "docs/ROADMAP.md"
      - "docs/THREAT_MODEL.md"
      - ".github/workflows/mcp-governance.yml"
  pull_request:
    paths:
      - "src/regagentops/mcp.py"
      - "tests/test_mcp*.py"
      - "schemas/mcp-*.json"
      - "pyproject.toml"
      - "README.md"
      - "docs/MCP_GOVERNANCE.md"
      - "docs/ARCHITECTURE.md"
      - "docs/ROADMAP.md"
      - "docs/THREAT_MODEL.md"
      - ".github/workflows/mcp-governance.yml"

permissions:
  contents: read

jobs:
  mcp-governance-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e .
      - name: Run MCP governance regression tests
        run: python -m unittest discover -s tests -p 'test_mcp*.py' -v
      - name: Verify v0.4+ MCP contracts
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import tomllib

          payload = tomllib.load(open('pyproject.toml', 'rb'))
          version = tuple(int(part) for part in payload['project']['version'].split('.'))
          assert version >= (0, 4, 0)
          assert payload['project']['dependencies'] == ['PyJWT[crypto]>=2.13,<3']

          expected = {
              'mcp-server-registration.schema.json': 'regagentops.mcp-server-registration.v1',
              'mcp-tool-descriptor.schema.json': 'regagentops.mcp-tool-descriptor.v1',
              'mcp-tool-snapshot.schema.json': 'regagentops.mcp-tool-snapshot.v1',
              'mcp-tool-binding.schema.json': 'regagentops.mcp-tool-binding.v1',
              'mcp-policy-enforcement-result.schema.json': 'regagentops.mcp-policy-enforcement-result.v1',
          }
          for filename, discriminator in expected.items():
              schema = json.loads((Path('schemas') / filename).read_text(encoding='utf-8'))
              assert schema['$schema'] == 'https://json-schema.org/draft/2020-12/schema'
              assert schema['additionalProperties'] is False
              assert schema['properties']['schema_version']['const'] == discriminator
          assert json.loads(Path('schemas/mcp-tool-snapshot.schema.json').read_text())['properties']['tools']['maxItems'] == 128
          result = json.loads(Path('schemas/mcp-policy-enforcement-result.schema.json').read_text())
          assert result['properties']['execution_performed']['const'] is False
          assert 'human_approval_required' in result['required']
          assert 'constraints' in result['required']
          PY
      - name: Verify bounded offline MCP capability surface
        shell: bash
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          path = Path('src/regagentops/mcp.py')
          source = path.read_text(encoding='utf-8')
          tree = ast.parse(source, filename=str(path))
          banned = {'asyncio', 'ftplib', 'http', 'requests', 'socket', 'subprocess', 'telnetlib', 'urllib'}
          for node in ast.walk(tree):
              if isinstance(node, ast.Import):
                  roots = {alias.name.split('.')[0] for alias in node.names}
              elif isinstance(node, ast.ImportFrom) and node.module:
                  roots = {node.module.split('.')[0]}
              else:
                  continue
              blocked = roots & banned
              if blocked:
                  raise SystemExit(f'{path}: forbidden capability import(s): {sorted(blocked)}')

          for marker in ('list_tools(', 'discover_tools(', 'connect(', 'requests.', 'httpx.'):
              if marker in source:
                  raise SystemExit(f'MCP governance core must not contain autonomous discovery/network marker: {marker}')
          if 'MCP_MAX_TOOLS_PER_SNAPSHOT = 128' not in source:
              raise SystemExit('MCP ingestion must remain explicitly bounded')
          if 'execution_performed=False' not in source:
              raise SystemExit('MCP PEP must remain non-executing')
          if 'AuthenticatedPolicyEngine' not in source or 'ApprovalGate' in source:
              raise SystemExit('MCP PEP boundary must reuse authenticated policy without embedding the approval engine')
          PY